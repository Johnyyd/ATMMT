version: '3.8'

services:
  # Frontend Web Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat_frontend
    restart: always
    cap_drop:
      - ALL
    ports:
      - "5173:8080"
    environment:
      - VITE_API_BASE_URL=/api

  # Backend FastAPI Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat_backend
    restart: always
    cap_drop:
      - ALL
    ports:
      - "7000:7000"
    environment:
      - DATABASE_URL=sqlite:////app/data/guestbook.db
      - JWT_SECRET_KEY=b67c8585489f66710b42c4b8e21a287c954e7d4a96b4b5c8
    volumes:
      - backend_db_data:/app/data
      - backend_uploads:/app/uploads

  # Tailscale Public Proxy for Frontend (Johnyyd/tailscale_public_url pattern)
  tailscale-frontend:
    build:
      context: ./tailscale
      dockerfile: Dockerfile.tailscale
    container_name: chat
    hostname: chat
    restart: always
    environment:
      - TS_AUTHKEY=tskey-auth-kMvFmVxPpg11CNTRL-dWkCF7p8tLFLXHhgSqzsKFc5bp7aHEYf
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_TARGET_HOST=frontend
      - TS_TARGET_PORT=8080
      - TS_FUNNEL_PORT=443
    volumes:
      - ts_frontend_state:/var/lib/tailscale
    depends_on:
      - frontend

  # Tailscale Public Proxy for Backend (Johnyyd/tailscale_public_url pattern)
  tailscale-backend:
    build:
      context: ./tailscale
      dockerfile: Dockerfile.tailscale
    container_name: chat_ts
    hostname: chat-ts
    restart: always
    environment:
      - TS_AUTHKEY=tskey-auth-kMvFmVxPpg11CNTRL-dWkCF7p8tLFLXHhgSqzsKFc5bp7aHEYf
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_TARGET_HOST=backend
      - TS_TARGET_PORT=7000
      - TS_FUNNEL_PORT=7443
    volumes:
      - ts_backend_state:/var/lib/tailscale
    depends_on:
      - backend

volumes:
  backend_db_data:
  backend_uploads:
  ts_frontend_state:
  ts_backend_state:
