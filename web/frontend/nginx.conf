map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1. Định nghĩa Rate Limit chống Spam API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 8080;
    server_name localhost;

    # 2. Ẩn thông tin phiên bản Nginx
    server_tokens off;

    # 3. Giới hạn dung lượng tải lên toàn server (Ví dụ: Tối đa 10MB)
    # Ngăn chặn DoS bằng cách làm đầy ổ cứng
    client_max_body_size 10M;

    # 4. Các Header bảo vệ HTTP tiêu chuẩn
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Bật Rate Limit cho API (cho phép dồn 20 request cùng lúc)
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:7000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # QUAN TRỌNG: Chỉ set timeout dài cho endpoint WebSocket cụ thể
        # Nếu /api/ chủ yếu là REST (GET, POST), hãy để timeout ngắn (ví dụ 60s). 
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Mẹo: Nếu bạn có endpoint riêng cho WebSocket (ví dụ /api/ws/), hãy tách block riêng:
    location /api/ws/ {
        proxy_pass http://backend:7000/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s; # Chỉ cho phép giữ kết nối 24h ở đường dẫn WebSocket này
        proxy_send_timeout 86400s;
    }

    location /uploads/ {
        proxy_pass http://backend:7000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
